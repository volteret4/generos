# Instalación por separado. Dentro de REPEAT-ONE se usa el docker-compose.yml de REPEAT-ONE.
services:
  generos:
    build: .
    container_name: generos
    restart: unless-stopped
    user: "${UID_GID:-1000:1000}"
    env_file:
      - path: .env
        required: false
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    volumes:
      - ./data:/app/data
      - ${MUSICA:?Pon en .env la carpeta de tu música (MUSICA)}:/music
      # Opcional: must_hear.db y genres.json de escuchowsky, como fuente más de géneros
      # - /ruta/a/escuchowsky/db:/data/escuchowsky:ro
    ports:
      - "${PUERTO:-8785}:5000"
    labels:
      ofelia.enabled: "true"
      repeat-one.ofelia: "generos"
      ofelia.job-exec.generos-scan.schedule: "0 20 1 * * *"
      ofelia.job-exec.generos-scan.command: "nice -n 19 ionice -c 3 python3 -c 'import biblioteca; biblioteca.scan()'"

  # Ofelia lanza los trabajos programados de las etiquetas ofelia.job-exec.* de arriba
  # (los mismos horarios que en REPEAT-ONE). Solo ve los contenedores de este repo.
  # Si no quieres actualizaciones automáticas: docker compose stop ofelia
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker --docker-filter=label=repeat-one.ofelia=generos
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - generos
